name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      LAYA_MLX_TEST_DEVICE: cpu
      TOKENIZERS_PARALLELISM: "false"
      USE_TF: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: ffc142012af63d015fa19f05f29f9c5ff329a2cc
          path: .upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,reference,demo,serve,mcp,structured,llamaindex]'
      - run: ruff check . && ruff format --check .
      # Run timing-sensitive upstream host contracts before native model tests,
      # in a separate process. Keep every upstream assertion and timeout unchanged.
      - name: Upstream host contracts
        run: pytest -q tests/test_official_contract.py
      - name: Native and integration tests
        run: pytest -q --ignore=tests/test_official_contract.py
      - name: Diagnose native CPU failures
        if: failure()
        run: python -u -m scripts.diagnose_parallel_cpu
      - name: Show native crash reports
        if: failure()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          folder = Path.home() / "Library/Logs/DiagnosticReports"
          for path in sorted(folder.glob("*Python*"))[-2:]:
              print(path.name)
              print(path.read_text()[:40000])
          PYCODE
      - run: python -m build
